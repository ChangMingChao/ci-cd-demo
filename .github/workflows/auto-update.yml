name: Auto Update Demo

on:
  schedule:
    # 每小时整点运行一次（UTC 时间，北京时间 = UTC+8）
    - cron: '* * * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 自动生成新版本
        run: |
          # 生成新版本号（基于时间戳）
          VERSION="v1.0.$(date +%s | cut -c7-9)"
          TIMESTAMP=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          
          # 随机颜色组合
          COLORS=("667eea,764ba2" "f093fb,f5576c" "4facfe,00f2fe" "43e97b,38f9d7" "fa709a,fee140" "a8edea,feed6c" "d299c2,fef9d7" "89f7fe,66a6ff")
          RANDOM_COLOR=${COLORS[$RANDOM % ${#COLORS[@]}]}
          COLOR1=$(echo $RANDOM_COLOR | cut -d, -f1)
          COLOR2=$(echo $RANDOM_COLOR | cut -d, -f2)
          
          # 随机 emoji
          EMOJIS=("🚀" "🎉" "✨" "🔥" "💎" "⚡" "🌟" "🎨" "🎯" "💫")
          RANDOM_EMOJI=${EMOJIS[$RANDOM % ${#EMOJIS[@]}]}
          
          # 生成新的 index.html
          cat > index.html << EOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <title>CI/CD Demo</title>
              <style>
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                      display: flex;
                      justify-content: center;
                      align-items: center;
                      height: 100vh;
                      margin: 0;
                      background: linear-gradient(135deg, #${COLOR1} 0%, #${COLOR2} 100%);
                      color: white;
                      transition: all 0.5s ease;
                  }
                  .card {
                      text-align: center;
                      background: rgba(255, 255, 255, 0.15);
                      padding: 3rem;
                      border-radius: 20px;
                      backdrop-filter: blur(10px);
                      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
                  }
                  h1 { font-size: 3rem; margin: 0 0 1rem 0; }
                  .version { font-size: 1.2rem; opacity: 0.9; margin-top: 1rem; }
                  .timestamp { font-size: 0.9rem; opacity: 0.7; margin-top: 0.5rem; }
                  .emoji { font-size: 4rem; margin-bottom: 1rem; }
              </style>
          </head>
          <body>
              <div class="card">
                  <div class="emoji">${RANDOM_EMOJI}</div>
                  <h1>CI/CD 自动部署成功！</h1>
                  <p>这是 GitHub Actions 自动更新 + Jenkins 自动部署的演示</p>
                  <div class="version">版本: ${VERSION}</div>
                  <div class="timestamp">部署时间: ${TIMESTAMP}</div>
              </div>
          </body>
          </html>
          EOF
          
          echo "✅ 生成新版本: ${VERSION}, 颜色: #${COLOR1} → #${COLOR2}, Emoji: ${RANDOM_EMOJI}"
      
      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "🤖 自动更新: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          git push
