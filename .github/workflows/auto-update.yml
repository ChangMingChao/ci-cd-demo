name: Auto Update Demo

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 安装依赖（Jinja2 + Faker + emoji）
        run: pip install -r requirements.txt
      
      - name: 构建页面
        run: python build.py
      
      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "🤖 自动构建: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          git push
