<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CI/CD Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #d299c2 0%, #fef9d7 100%);
            color: white;
            transition: all 0.5s ease;
        }
        .card {
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            padding: 3rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        h1 { font-size: 3rem; margin: 0 0 1rem 0; }
        .version { font-size: 1.2rem; opacity: 0.9; margin-top: 1rem; }
        .timestamp { font-size: 0.9rem; opacity: 0.7; margin-top: 0.5rem; }
        .emoji { font-size: 4rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">💎</div>
        <h1>CI/CD 自动部署成功！</h1>
        <p>这是 GitHub Actions 自动更新 + Jenkins 自动部署的演示</p>
        <div class="version">版本: v1.0.095</div>
        <div class="timestamp">部署时间: 2026-08-24 16:42:37</div>
    </div>
</body>
</html>
