<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CI/CD Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            transition: all 0.5s ease;
        }
        .card {
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            padding: 3rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 500px;
        }
        h1 { font-size: 2.5rem; margin: 0 0 1rem 0; }
        .version { font-size: 1.2rem; opacity: 0.9; margin-top: 1rem; }
        .timestamp { font-size: 0.9rem; opacity: 0.7; margin-top: 0.5rem; }
        .emoji-icon { font-size: 4rem; margin-bottom: 1rem; }
        .quote {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            font-style: italic;
        }
        .info { font-size: 0.85rem; opacity: 0.6; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji-icon">:dart:</div>
        <h1>CI/CD 自动部署成功！</h1>
        <p>出来到了电子语言他们类型品牌知道因此搜索出现.</p>
        <div class="quote">起来教育的人为什资源只有中文.</div>
        <div class="version">版本: v1.0.331</div>
        <div class="timestamp">部署时间: 2026-08-24 18:12:11</div>
        <div class="info">生成者: 王桂芝 | 城市: 郑州县</div>
    </div>
</body>
</html>
